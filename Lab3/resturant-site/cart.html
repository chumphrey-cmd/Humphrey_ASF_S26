<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lorem Ipsum Cafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="stylesheet" href="css/styles.css">
    <script src="https://kit.fontawesome.com/c5ef0c99ee.js" crossorigin="anonymous"></script>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!-- Nav with PNG Logo -->
<nav class="navbar navbar-expand-lg sticky-top custom-editorial-nav">
    <div class="container-fluid px-4 px-md-5">

        <a class="navbar-brand" href="index.html">
            <img src="./images/logo_2.png" alt="Lorem Ipsum Cafe Logo" class="logo-img">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav gap-0.1">
                <li class="nav-item">
                    <a class="nav-link custom-nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link custom-nav-link" href="menu.html">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link custom-nav-link" href="reservations.html">Reservations</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link custom-nav-link" href="cart.html">Cart</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<main class="container my-5">
    <h2 class="mb-4" style="font-family: 'Quicksand', sans-serif; font-size: 3rem; color: #2c3e50;">Your Cart</h2>

    <div id="empty-cart-msg" class="text-center py-5" style="display: none;">
        <i class="fa-solid fa-basket-shopping fa-4x text-muted mb-3"></i>
        <h4 class="text-muted">Your cart is empty.</h4>
        <a href="menu.html" class="btn btn-outline-dark mt-3">Back to Menu</a>
    </div>

    <div id="cart-content">
        <div class="table-responsive mb-4 shadow-sm">
            <table class="table align-middle mb-0" style="background-color: #f8f6f0;">
                <thead class="table-dark">
                <tr>
                    <th>Item</th>
                    <th class="text-center">Quantity</th>
                    <th class="text-end">Price</th>
                    <th class="text-end">Line Total</th>
                </tr>
                </thead>
                <tbody id="cart-table-body"></tbody>
                <tbody id="subtotal"></tbody>
                <tbody id="tax"></tbody>
                <tbody id="final-total"></tbody>
            </table>
        </div>

        <div class="row justify-content-end">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm" style="background-color: #f8f6f0;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="cart-subtotal" class="fw-bold"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Tax (8.25%)</span>
                            <span id="cart-tax"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold">Total</span>
                            <span id="cart-total" class="fs-5 fw-bold text-success"></span>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="submitOrderBtn" class="btn btn-dark btn-lg" style="text-transform: uppercase; letter-spacing: 1px;">Submit Order</button>
<!--                            <button id="cancelOrderBtn" class="btn btn-outline-danger">Cancel Order</button>-->
                            <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#cancelModal">
                                Cancel Order
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 0;">
                <div class="modal-body text-center p-5">
                    <h4 class="mb-4">Are you sure you want to cancel your order?</h4>
                    <button type="button" class="btn btn-danger px-4 me-2" id="confirmCancelBtn">Yes, Cancel</button>
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">No, Keep It</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="thankYouModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-5" style="border-radius: 0; background-color: #f8f6f0; position: relative;">

                <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>

                <div class="modal-body">
                    <i class="fa-solid fa-leaf fa-3x text-success mb-3"></i>
                    <h3 id="thankYouMessage" style="font-family: 'Quicksand', sans-serif; color: #2c3e50;">Thank you for your order!</h3>
                    <p class="text-muted mt-2">Redirecting you back to the menu in 3 seconds...</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/shopping_cart.js"></script>
</body>
</html>
